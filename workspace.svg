<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <!-- Background wall gradient -->
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#403632"/>
      <stop offset="40%" stop-color="#2D272A"/>
      <stop offset="100%" stop-color="#18151B"/>
    </linearGradient>

    <!-- Warm ambient lamp glow -->
    <radialGradient id="warmLight" cx="15%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#FFD4A3" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#FF8C42" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Neon light cyan glow filter -->
    <filter id="cyanGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Monitor screen ROG glow -->
    <linearGradient id="rogGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1A75"/>
      <stop offset="50%" stop-color="#A81561"/>
      <stop offset="100%" stop-color="#2E0854"/>
    </linearGradient>

    <!-- Foreground screen glow -->
    <linearGradient id="forestGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B2027"/>
      <stop offset="50%" stop-color="#20505A"/>
      <stop offset="100%" stop-color="#071215"/>
    </linearGradient>
  </defs>

  <!-- Wall & Room Background -->
  <rect width="400" height="500" fill="url(#wallGrad)"/>
  <rect width="400" height="500" fill="url(#warmLight)"/>

  <!-- Left Window / Door frame silhouette -->
  <rect x="52" y="90" width="60" height="175" rx="3" fill="#1A1516" stroke="#2D2423" stroke-width="2"/>
  <line x1="52" y1="145" x2="112" y2="145" stroke="#2D2423" stroke-width="1.5"/>
  <line x1="52" y1="180" x2="112" y2="180" stroke="#2D2423" stroke-width="1.5"/>

  <!-- 3 Framed Pictures on the wall -->
  <!-- Frame 1 -->
  <rect x="205" y="96" width="36" height="42" rx="1.5" fill="#FAF6EE" stroke="#121014" stroke-width="3"/>
  <!-- Minimalist car silhouette -->
  <path d="M 213 120 L 219 114 L 227 114 L 233 120 Z" fill="#D9483B"/>
  <rect x="212" y="119" width="22" height="3" fill="#121014"/>

  <!-- Frame 2 -->
  <rect x="252" y="78" width="40" height="46" rx="1.5" fill="#FAF6EE" stroke="#121014" stroke-width="3"/>
  <!-- Minimalist car silhouette 2 -->
  <path d="M 260 104 L 267 98 L 277 98 L 284 104 Z" fill="#3B82F6"/>
  <rect x="259" y="103" width="26" height="3" fill="#121014"/>

  <!-- Frame 3 -->
  <rect x="304" y="78" width="40" height="46" rx="1.5" fill="#FAF6EE" stroke="#121014" stroke-width="3"/>
  <!-- Minimalist car silhouette 3 -->
  <path d="M 312 104 L 319 98 L 329 98 L 336 104 Z" fill="#10B981"/>
  <rect x="311" y="103" width="26" height="3" fill="#121014"/>

  <!-- Wavy Cyan Neon Tube Light on the Wall -->
  <!-- Ambient Neon Diffusion -->
  <path d="M 125 152 Q 140 128 160 135 T 195 158 T 235 168 T 275 145 T 315 138 T 365 85 T 400 82" 
        fill="none" stroke="#00F0FF" stroke-width="12" stroke-linecap="round" opacity="0.35" filter="url(#cyanGlow)"/>
  <!-- Main Glowing Core -->
  <path d="M 125 152 Q 140 128 160 135 T 195 158 T 235 168 T 275 145 T 315 138 T 365 85 T 400 82" 
        fill="none" stroke="#67E8F9" stroke-width="4" stroke-linecap="round"/>
  <!-- Bright Inner Filament -->
  <path d="M 125 152 Q 140 128 160 135 T 195 158 T 235 168 T 275 145 T 315 138 T 365 85 T 400 82" 
        fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Studio Light & Tripod on Left -->
  <rect x="97" y="156" width="36" height="20" rx="3" fill="#F8FAFC" opacity="0.9"/>
  <line x1="115" y1="176" x2="115" y2="280" stroke="#1F1D24" stroke-width="3"/>
  <line x1="115" y1="280" x2="100" y2="330" stroke="#1F1D24" stroke-width="2"/>
  <line x1="115" y1="280" x2="130" y2="330" stroke="#1F1D24" stroke-width="2"/>

  <!-- Work Desk Silhouette -->
  <rect x="125" y="244" width="255" height="135" fill="#1C1819" rx="2"/>
  <!-- Desk Top Surface Line -->
  <rect x="120" y="240" width="265" height="9" fill="#3D322B" rx="1.5"/>

  <!-- Secondary Laptop on Left of Desk -->
  <rect x="150" y="210" width="60" height="35" rx="2" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <rect x="153" y="213" width="54" height="29" fill="#1E293B"/>
  <line x1="145" y1="245" x2="215" y2="245" stroke="#475569" stroke-width="2"/>

  <!-- ASUS ROG Monitor Stand & Arm -->
  <polygon points="266,242 278,242 274,228 270,228" fill="#1F1D24"/>
  <rect x="270" y="222" width="4" height="15" fill="#334155"/>

  <!-- ASUS ROG Gaming Monitor Screen -->
  <rect x="215" y="176" width="102" height="58" rx="2" fill="#0A0A10" stroke="#25242D" stroke-width="2"/>
  <rect x="217" y="178" width="98" height="54" rx="1" fill="url(#rogGrad)"/>

  <!-- ROG Eye Logo stylized vector -->
  <path d="M 248 196 Q 262 188 275 200 Q 268 206 256 206 Z" fill="#FFFFFF" opacity="0.92"/>
  <polygon points="252,204 266,196 268,200 254,208" fill="#FFFFFF" opacity="0.95"/>
  <!-- JOIN THE REPUBLIC Text hint -->
  <rect x="242" y="218" width="48" height="2" fill="#FFFFFF" opacity="0.75"/>

  <!-- Desk Items: Metal Flask & Potted Plant on Right -->
  <rect x="315" y="202" width="16" height="42" rx="4" fill="#94A3B8"/>
  <ellipse cx="323" cy="202" rx="8" ry="2" fill="#CBD5E1"/>
  <!-- Little Plant -->
  <path d="M 350 236 Q 346 220 342 216 Q 352 222 352 236" fill="#10B981"/>
  <path d="M 353 236 Q 358 218 364 214 Q 360 226 355 236" fill="#059669"/>
  <rect x="345" y="234" width="14" height="10" rx="1" fill="#78350F"/>

  <!-- Ergonomic Mesh High-Back Chair (Left Foreground) -->
  <!-- Headrest -->
  <rect x="28" y="186" width="60" height="26" rx="8" fill="#1F242D" stroke="#11141A" stroke-width="2"/>
  <!-- Spine & Backrest Frame -->
  <path d="M 38 212 Q 22 260 26 320 L 72 320 Q 76 260 62 212 Z" fill="#161A22" stroke="#0F1217" stroke-width="2"/>
  <!-- Armrest Left -->
  <path d="M 40 270 L 68 270 Q 76 270 78 285 L 78 300" fill="none" stroke="#28303E" stroke-width="6" stroke-linecap="round"/>
  <!-- Seat Cushion -->
  <ellipse cx="64" cy="326" rx="40" ry="14" fill="#1B202A"/>
  <!-- Chair Base & Gas Lift Cylinder -->
  <rect x="61" y="338" width="7" height="35" fill="#0B0D11"/>
  <path d="M 64 365 L 20 405 M 64 365 L 75 410 M 64 365 L 110 395" stroke="#161A22" stroke-width="5" stroke-linecap="round"/>

  <!-- Foreground Laptop Screen with Misty Forest Wallpaper & 9:57 Clock -->
  <rect x="0" y="320" width="340" height="180" rx="10" fill="#050709" stroke="#161F2B" stroke-width="2.5"/>
  <rect x="4" y="324" width="332" height="172" rx="8" fill="url(#forestGrad)"/>
  <!-- Misty tall pine trees silhouette -->
  <path d="M 30 500 L 45 380 L 60 500 Z" fill="#0A161B" opacity="0.8"/>
  <path d="M 90 500 L 110 360 L 130 500 Z" fill="#071217"/>
  <path d="M 180 500 L 205 350 L 230 500 Z" fill="#060F13"/>
  <path d="M 270 500 L 290 375 L 310 500 Z" fill="#0B1A22" opacity="0.85"/>
  <!-- Ambient Fog in trees -->
  <ellipse cx="140" cy="420" rx="90" ry="40" fill="#67E8F9" opacity="0.18" filter="url(#cyanGlow)"/>

  <!-- Lockscreen Digital Clock: 9:57 -->
  <text x="145" y="365" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, sans-serif" font-size="10" font-weight="600" fill="#CBD5E1" text-anchor="middle" letter-spacing="1">Sun 20 Sep</text>
  <text x="145" y="405" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, sans-serif" font-size="38" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="-1">9:57</text>

  <!-- Vignette overlay for photographic atmosphere -->
  <rect width="400" height="500" fill="none" stroke="#000000" stroke-width="20" opacity="0.25"/>
</svg>
